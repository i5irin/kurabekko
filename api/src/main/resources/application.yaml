server:
  port: 8080
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  apiKey: ${APP_API_KEY:dev-api-key}

line:
  bot:
    channelSecret: ${LINE_CHANNEL_SECRET:}
    channelToken: ${LINE_CHANNEL_TOKEN:}
    handler:
      path: /line/webhook
        

spring:
  application:
    name: Kurabekko API
  cloud:
    azure:
      cosmos:
        enabled: ${COSMOS_ENABLED:false}
        endpoint: ${COSMOS_ENDPOINT:}
        key: ${COSMOS_KEY:}
        database: ${COSMOS_DATABASE:kurabekko-dev-db}

logging:
  level:
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
