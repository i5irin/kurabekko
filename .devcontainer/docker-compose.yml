version: "3.9"
services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/repo:cached
      # Docker outside of Docker
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspaces/repo
    command: sleep infinity
    # Allow vscode user to access host docker.sock
    group_add:
      - "0"
